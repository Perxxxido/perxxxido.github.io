<!DOCTYPE html>
<html lang="ru">
<head>
	<title>pack УЙ</title>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="assets/srv/main.css"/>
    <link rel="icon" href="assets/img/icon-light.svg" type="image/svg+xml"/> <!--У меня есть и icon-dark.svg, хотелось бы сделать его изменяемым в соответсвии с темой-->
    <script src="assets/srv/main.js"></script>
</head>
<body>
    <header>
        <h1><u>pack</u>УЙ</h1>
        <div class="bottom-line" id="bottomLine"></div>
        <div class="header-controls">
            <button class="menu-button" id="menuButton" type="button" aria-expanded="false">
                <span class="burger" aria-hidden="true"><span></span><span></span><span></span></span>
                <span class="menu-button__text">Меню</span>
            </button>

            <button class="theme-button" id="themeButton" type="button" aria-label="Переключить тему">
                <svg class="icon icon-sun" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true">
                    <circle cx="12" cy="12" r="4"/>
                    <path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/>
                </svg>
                <svg class="icon icon-moon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                    <path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/>
                </svg>
            </button>
        </div>
    </header>

    <main>
        <section>
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
                <!-- Circle face -->
                <circle cx="50" cy="50" r="42" fill="none" stroke="currentColor" stroke-width="1"/>

                <!-- Closed happy eyes -->
                <path d="M28 44 Q34 36 40 44" fill="none" stroke="currentColor" stroke-width="1" stroke-linecap="round"/>
                <path d="M60 44 Q66 36 72 44" fill="none" stroke="currentColor" stroke-width="1" stroke-linecap="round"/>

                <!-- Smile -->
                <path d="M32 60 Q50 76 68 60" fill="none" stroke="currentColor" stroke-width="1" stroke-linecap="round"/>
            </svg>
            <div class="content">
                <h2>Удобство</h2>
                <p>Наше приложение имеет отличный баланс между простотой и функциональностью. Для этого мы разделили пользователей на "Мастеров" и "Обывателей". Мастера создают кирпичики, а обыватели из них создают свои пакеты.</p>
            </div>
        </section>
    </main>
